<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정산 파이프라인 — 주문에서 파트너 정산까지 (운영 흐름 · 재생)</title>
<style>
  :root{
    --bg:#0f1420;--panel:#171e2e;--line:#2a3550;--txt:#dce3f0;--dim:#8593ad;
    --acc:#8fb2ff;--chg:#e8c06a;--ok:#7fd4a8;--key:#9db4de;--str:#b5e0a0;--num:#e0b080;
    /* 인프라 색 (architecture.html과 통일) */
    --src:#4a7dbd;--cdc:#c0704a;--kafka:#7a5abd;--app:#3f9d6e;--lake:#bd9a3f;--obs:#b05070;--payout:#c9a24b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:22px 26px}
  h1{font-size:20px;margin-bottom:4px}
  h1 .oid{color:var(--acc)}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px}

  /* ── 컨트롤 바 ── */
  .controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .btn{background:#233252;color:var(--txt);border:1px solid #35496f;border-radius:9px;padding:8px 16px;
       font-size:13px;cursor:pointer;font-weight:700;transition:.12s}
  .btn:hover{background:#2c3f66}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.play{background:#1f5c3f;border-color:#2f8a5e}
  .btn.play:hover{background:#256f4c}
  .btn.play.on{background:#7a4a1f;border-color:#b0702f}
  .speed{display:flex;gap:4px;align-items:center;margin-left:6px}
  .speed span{font-size:11.5px;color:var(--dim)}
  .sp{background:#1a2233;border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:5px 9px;font-size:11.5px;cursor:pointer}
  .sp.on{border-color:var(--acc);color:var(--acc)}
  .prog{margin-left:auto;color:var(--dim);font-size:12px}

  /* ── AWS 스타일 아키텍처 보드 ── */
  .boardwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#121828;padding:14px;margin-bottom:16px}
  .board{position:relative;width:880px;height:470px;margin:0 auto}
  svg.links{position:absolute;inset:0;pointer-events:none;overflow:visible}
  path.link{fill:none;stroke:#38466a;stroke-width:2}
  path.link.dash{stroke-dasharray:5 5;stroke:#4a3f6a}
  path.link.flow{stroke:var(--acc);stroke-width:3.2;filter:drop-shadow(0 0 5px #8fb2ffcc)}
  path.link.flow.dashflow{stroke:var(--obs)}

  /* 그룹 박스 (AWS VPC/경계 느낌) */
  .grp{position:absolute;border:1.6px dashed #b39a4a80;border-radius:14px;background:#bd9a3f0d;transition:.25s}
  .grp.on{border-color:var(--lake);background:#bd9a3f1f;box-shadow:0 0 20px -3px var(--lake)}
  .grp .gtab{position:absolute;top:-12px;left:16px;background:#121828;padding:2px 10px;font-size:10.5px;
             color:#d7b85f;border:1px solid #b39a4a66;border-radius:7px;white-space:nowrap}
  .grp .gin{position:absolute;bottom:9px;left:0;right:0;text-align:center;font-size:10.5px;color:#9a8850}

  /* 노드 타일 */
  .pnode{position:absolute;background:var(--panel);border:1.5px solid var(--line);border-top-width:4px;
         border-radius:11px;padding:8px 11px;cursor:pointer;transition:.18s;z-index:3;display:flex;
         flex-direction:column;justify-content:center}
  .pnode:hover{transform:translateY(-2px);border-color:#5b6d94}
  .pnode.active{border-color:var(--acc);box-shadow:0 0 0 2px #8fb2ff44,0 8px 20px #0007;z-index:4}
  .pnode.passed .stepno{background:var(--ok);color:#10241a;border-color:var(--ok)}
  .pnode .stepno{position:absolute;top:-9px;left:-8px;width:21px;height:21px;border-radius:50%;
                 background:var(--panel);border:1.5px solid var(--line);font-size:10px;font-weight:700;
                 color:var(--dim);display:flex;align-items:center;justify-content:center;z-index:5}
  .pnode.active .stepno{border-color:var(--acc);color:var(--acc)}
  .pnode .hd{display:flex;align-items:center;gap:6px}
  .pnode .ic{font-size:15px;line-height:1}
  .pnode .nm{font-size:12.5px;font-weight:700;line-height:1.2}
  .pnode .tech{font-size:9.5px;color:var(--dim);margin-top:3px;line-height:1.3}
  /* 지원 인프라 타일 (단계 없음) */
  .pnode.sup{cursor:default;opacity:.72;border-top-width:1.5px;border-style:dashed}
  .pnode.sup:hover{transform:none}
  .pnode.sup.on{opacity:1;box-shadow:0 0 14px -2px currentColor}

  /* 이동 패킷 */
  .packet{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--acc);
          box-shadow:0 0 0 5px #8fb2ff33,0 0 16px 4px #8fb2ffaa;transform:translate(-50%,-50%);
          transition:left .62s cubic-bezier(.5,0,.2,1),top .62s cubic-bezier(.5,0,.2,1);z-index:9;pointer-events:none}
  .packet::after{content:'주문 64823';position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
                 white-space:nowrap;font-size:9.5px;color:var(--acc);font-weight:700;text-shadow:0 0 6px #000}
  .packet.hop{animation:hop .62s ease}
  @keyframes hop{0%{transform:translate(-50%,-50%) scale(1)}45%{transform:translate(-50%,-50%) scale(1.55)}100%{transform:translate(-50%,-50%) scale(1)}}

  /* ── 상세 패널 ── */
  .view{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;min-height:300px}
  .view h2{font-size:16px;color:var(--acc)}
  .view .where{font-size:11.5px;color:var(--dim);margin:3px 0 4px}
  .view .does{font-size:12.5px;color:var(--chg);font-weight:700;margin:8px 0 10px;padding:7px 11px;
              background:#241f12;border-left:3px solid var(--chg);border-radius:6px}
  .view .desc{font-size:13px;line-height:1.75;margin-bottom:12px}
  .view .desc b{color:var(--chg)}
  .datalabel{font-size:11px;color:var(--key);font-weight:700;margin:14px 0 6px;letter-spacing:.4px}
  pre{background:#0b0f18;border:1px solid #222b40;border-radius:10px;padding:13px 15px;font-size:12px;
      line-height:1.6;overflow-x:auto;font-family:'SF Mono',Consolas,'D2Coding',monospace;white-space:pre}
  .k{color:var(--key)} .s{color:var(--str)} .n{color:var(--num)} .c{color:#5a6885}
  .hl{background:#3d3418;border-radius:3px;padding:0 3px;color:var(--chg)}
  table{border-collapse:collapse;font-size:12px;width:100%;font-family:'SF Mono',Consolas,'D2Coding',monospace}
  th{color:var(--key);text-align:left;padding:5px 10px;border-bottom:1px solid var(--line);font-size:11px}
  td{padding:4.5px 10px;border-bottom:1px solid #1e2740}
  td.hl2{color:var(--chg)}
  .note{margin-top:12px;font-size:11.5px;color:var(--dim);line-height:1.6;border-top:1px dashed var(--line);padding-top:10px}
</style>
</head>
<body>
<h1>주문에서 파트너 정산까지 — 주문 <span class="oid">64823</span> 의 실제 운영 흐름</h1>
<div class="sub">▶ 재생을 누르면 데이터가 인프라를 타고 흐릅니다 · 노드/단계 클릭 또는 ◀ ▶ 키 · 예시값은 샘플</div>

<div class="controls">
  <button class="btn play" id="playBtn">▶ 재생</button>
  <button class="btn" id="resetBtn">↺ 처음으로</button>
  <button class="btn" id="prevBtn">◀ 이전</button>
  <button class="btn" id="nextBtn">다음 ▶</button>
  <div class="speed"><span>속도</span>
    <span class="sp" data-sp="1.6">0.5×</span>
    <span class="sp on" data-sp="1">1×</span>
    <span class="sp" data-sp="0.5">2×</span>
  </div>
  <span class="prog" id="prog"></span>
</div>

<!-- AWS 스타일 보드 -->
<div class="boardwrap" id="boardwrap">
  <div class="board" id="board">
    <svg class="links" id="links" viewBox="0 0 880 470" width="880" height="470">
      <defs>
        <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#4a5b82"></path>
        </marker>
        <marker id="arwf" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#8fb2ff"></path>
        </marker>
      </defs>
    </svg>
    <div class="grp" id="lakebox" style="left:210px;top:205px;width:486px;height:118px">
      <div class="gtab">🧊 Lakehouse — Apache Iceberg 테이블 (스토리지 + 카탈로그 분리)</div>
    </div>
    <div class="packet" id="packet"></div>
  </div>
</div>

<!-- 상세 -->
<div class="view" id="view"></div>

<script>
/* 인프라 노드 — 좌표(x,y) 고정 픽셀, AWS 다이어그램식 2D 배치 */
const NODES=[
  // 흐름 노드 (단계 번호 있음)
  {id:"pg",      flow:true, x:16,  y:40,  w:152,h:60, c:"--src",   ic:"🗄️", nm:"Postgres",    tech:"paydb · orderdb (OLTP)"},
  {id:"dbz",     flow:true, x:204, y:40,  w:152,h:60, c:"--cdc",   ic:"🔁", nm:"Debezium",     tech:"Kafka Connect · CDC"},
  {id:"kafka",   flow:true, x:392, y:40,  w:152,h:60, c:"--kafka", ic:"📨", nm:"Kafka",        tech:"토픽 × 파티션 (스트리밍)"},
  {id:"consumer",flow:true, x:580, y:40,  w:152,h:60, c:"--app",   ic:"⚙️", nm:"싱크 컨슈머",   tech:"Spring Boot · 8스레드"},
  {id:"spark",   flow:true, x:210, y:380, w:150,h:60, c:"--lake",  ic:"✨", nm:"정산 계산",     tech:"Spark 배치"},
  {id:"payout",  flow:true, x:470, y:380, w:152,h:60, c:"--payout",ic:"💰", nm:"파트너 정산",   tech:"집계 → 지급 명세"},
  // 지원 인프라 (단계 없음 · 클릭하면 상세 카드)
  {id:"nessie",  flow:false,x:232, y:238, w:200,h:58, c:"--lake",  ic:"🗂️", nm:"Nessie 카탈로그", tech:"어떤 파일이 최신인가 (원자 커밋)"},
  {id:"minio",   flow:false,x:474, y:238, w:200,h:58, c:"--lake",  ic:"🪣", nm:"MinIO (S3)",     tech:"파일의 실제 바이트 저장"},
  {id:"dlt",     flow:false,x:392, y:138, w:152,h:42, c:"--kafka", ic:"⚠️", nm:"DLT",          tech:"실패 메시지 격리"},
  {id:"obs",     flow:false,x:712, y:380, w:150,h:60, c:"--obs",   ic:"📈", nm:"Prometheus·Grafana", tech:"실시간 관측"},
];

/* 커넥터 (SVG path) — id는 하이라이트용 */
const LINKS=[
  {id:"pg_dbz",       d:"M168,70 L200,70"},
  {id:"dbz_kafka",    d:"M356,70 L388,70"},
  {id:"kafka_consumer",d:"M544,70 L576,70"},
  {id:"consumer_lake",d:"M656,100 L656,180 L574,180 L574,205"},   // 컨슈머 → 레이크(MinIO에 적재)
  {id:"nessie_minio", d:"M432,267 L470,267"},                     // 카탈로그 → 파일 (포인터)
  {id:"lake_spark",   d:"M285,323 L285,376"},                     // 레이크 → 정산
  {id:"spark_payout", d:"M360,410 L466,410"},                     // 정산 → 파트너 지급
  {id:"kafka_dlt",    d:"M468,100 L468,136",dash:true},           // 실패 → DLT
  {id:"obs_watch",    d:"M787,380 L787,70 L736,70",dash:true},    // 관측(감시)
];

/* 단계 = 운영 관점 데이터 흐름. node=주 인프라, support=함께 점등, conns=하이라이트 커넥터 */
const S=[
{node:"pg", support:[], conns:[],
 t:"주문·결제 발생", w:"Postgres · OLTP (paydb · orderdb)",
 h:"고객이 파트너 상품을 주문·결제 → 결제/주문 DB에 기록",
 d:"고객이 <b>주문 64823</b>으로 파트너 7의 상품 3개(합 10만원)를 <b>카드 7만 + 포인트 3만</b> 복합결제. 결제(paydb)와 주문(orderdb)은 <b>분리된 OLTP</b>에 INSERT되고, 결제는 헤더 + 수단별 원장으로 나뉩니다. 물리 FK 없이 논리 참조(무결성은 뒤의 대사가 검증).",
 x:`<div class="datalabel">orderdb.order_item (3행)</div><table>
<tr><th>order_no</th><th>line_no</th><th>partner_id</th><th>brand</th><th>item_amount</th></tr>
<tr><td>64823</td><td>1</td><td>7</td><td>1</td><td>50,000</td></tr>
<tr><td>64823</td><td>2</td><td>7</td><td>1</td><td>30,000</td></tr>
<tr><td>64823</td><td>3</td><td>7</td><td>1</td><td>20,000</td></tr></table>
<div class="datalabel">paydb.payment (헤더) + 수단별 원장</div><table>
<tr><th>테이블</th><th>키</th><th>amount</th><th>비고</th></tr>
<tr><td>payment</td><td>txn 100064823</td><td>100,000</td><td>type=1(승인)</td></tr>
<tr><td>payment_card</td><td>pm 90001 · mid 1001</td><td>70,000</td><td>주결제</td></tr>
<tr><td>payment_point</td><td>pm 90002</td><td>30,000</td><td>보조(수수료 0)</td></tr></table>`},

{node:"dbz", support:[], conns:["pg_dbz"],
 t:"변경 캡처 (CDC)", w:"Debezium (Kafka Connect)",
 h:"결제/주문 DB의 변경을 실시간으로 포착",
 d:"<b>wal_level=logical</b> WAL을 replication slot으로 구독해, 변경 1건마다 <b>{before, after, op, source}</b> 봉투를 만듭니다. <b>메시지 key = PK</b>(뒤 파티셔닝 기준). 각 변경엔 <b>source.lsn</b>(DB 전역 단조증가)이 붙어, 뒤에서 여러 토픽을 합칠 때 '무엇이 최신인가'의 유일한 기준이 됩니다.",
 x:`<div class="datalabel">Debezium 이벤트 (order_item 라인1)</div><pre>{
  <span class="k">"before"</span>: <span class="n">null</span>,                    <span class="c">// INSERT라 이전값 없음</span>
  <span class="k">"after"</span>: {
    <span class="k">"order_no"</span>: <span class="n">64823</span>, <span class="k">"line_no"</span>: <span class="n">1</span>,
    <span class="k">"partner_id"</span>: <span class="n">7</span>, <span class="k">"brand"</span>: <span class="n">1</span>, <span class="k">"item_amount"</span>: <span class="n">50000</span>
  },
  <span class="k">"op"</span>: <span class="s">"c"</span>,                         <span class="c">// c=생성 u=수정 d=삭제</span>
  <span class="k">"source"</span>: { <span class="k">"lsn"</span>: <span class="hl">171139502</span>, ... } <span class="c">// ★ 최신 판별 기준(_seq)</span>
}</pre>
<div class="datalabel">메시지 key (파티셔닝 기준)</div><pre>{<span class="k">"order_no"</span>: <span class="n">64823</span>, <span class="k">"line_no"</span>: <span class="n">1</span>}</pre>`},

{node:"kafka", support:["dlt","obs"], conns:["dbz_kafka","kafka_dlt","obs_watch"],
 t:"이벤트 스트리밍", w:"Kafka",
 h:"변경 이벤트를 안정적으로 버퍼링·전달",
 d:"테이블별 토픽 × 파티션. 프로듀서가 <b>hash(key) % N</b>으로 파티션을 정해 <b>같은 주문은 항상 같은 파티션</b>(그 주문의 순서 보장), 다른 주문은 흩어져 병렬 처리의 기반이 됩니다. 처리에 실패한 메시지는 <b>DLT로 격리</b>해 흐름을 막지 않고 유실도 없습니다.",
 x:`<pre>hash({"order_no":64823,"line_no":1}) % 4  =  <span class="hl">1</span>

토픽 order.public.order_item
  p0 [ ... ]
  p1 [ ..., <span class="hl">64823/1 @ offset 74211</span> ]   ← 여기 적재
  p2 [ ... ]
  p3 [ ... ]

<span class="c">// payment·수단별 원장·order_item·cancel = 테이블별 토픽으로 분산</span></pre>
<div class="datalabel">실패 메시지</div><pre><span class="c">// 깨진 메시지 → 재시도 → &lt;topic&gt;.DLT 로 격리 (유실 방지)</span></pre>`},

{node:"consumer", support:["lake","obs"], conns:["kafka_consumer","consumer_lake","nessie_minio","obs_watch"],
 t:"정규화·수집", w:"싱크 컨슈머 (Spring Boot) → Lakehouse 적재",
 h:"원장을 정산용 표준 형태로 바꿔 레이크에 저장",
 d:"컨슈머 8스레드가 파티션을 나눠 병렬 소비. 봉투를 벗겨 <b>정산에 필요한 컬럼만</b> 남기고, card/money/point/coupon <b>4원장을 단일 payment_method</b>(method 코드 1~4)로 통합해 <b>레이크(MinIO/Iceberg)에 저장</b>합니다. 중복·삭제는 저장 시점에 지우지 않고, <b>읽는 쪽이 _seq(LSN)로 정리</b> — 재처리·병렬·장애에도 결과가 같은 <b>멱등</b>의 근원.",
 x:`<div class="datalabel">변환: payment_card 이벤트 → canonical payment_method</div><pre><span class="c">// in (pay.public.payment_card 토픽에서)</span>
{ after: { pm_id:90001, txn_id:100064823, payments_mid:1001, amount:70000, ... } }

<span class="c">// out — canonical (method=1 로 통합 표기)</span>
{ table:<span class="s">"payment_method"</span>, op:<span class="s">"c"</span>, seq:<span class="hl">171139480</span>,
  data: { pm_id:<span class="n">90001</span>, txn_id:<span class="n">100064823</span>, order_no:<span class="n">64823</span>,
          <span class="hl">method:1</span>, payments_mid:<span class="n">1001</span>, amount:<span class="n">70000</span>, type:<span class="n">1</span> } }

<span class="c">// point 원장 → method:3, mid=null (보조수단)
// 저장: 테이블별 파일에 append → 읽을 때 key별 max(_seq) & _op≠'d' 로 dedup</span></pre>`},

{node:"spark", support:["lake"], conns:["lake_spark","nessie_minio"],
 t:"정산 계산", w:"Spark 배치 (Lakehouse 위에서)",
 h:"결제금액을 상품/파트너/수단별로 배분하고 수수료를 확정",
 d:"레이크에서 최신 상태를 읽어 정산합니다. ① 결제 10만원을 <b>상품가 비율로 라인 배분</b> ② 각 라인을 <b>카드 70% : 포인트 30%로 수단별 교차배분</b>(라인×수단) ③ 정산일 기준 <b>as-of 수수료를 박제(FREEZE)</b> — 이후 요율이 바뀌어도 이 건은 불변. 잔액 보정으로 1원도 새지 않습니다.",
 x:`<div class="datalabel">settlement_event (라인1의 2행 — 라인×수단)</div><table>
<tr><th>event_id</th><th>method</th><th>alloc</th><th>fee_rate</th><th>fee</th><th>net</th></tr>
<tr><td>1:100064823:1:1</td><td>1(카드)</td><td>35,000</td><td class="hl2">0.023</td><td>805</td><td>34,195</td></tr>
<tr><td>1:100064823:1:3</td><td>3(포인트)</td><td>15,000</td><td>0.000</td><td>0</td><td>15,000</td></tr></table>
<pre><span class="c">// 라인1 5만 = 카드 50000×70000/100000=35000 + 포인트 15000
// 라인2 3만 = 21000+9000 · 라인3 2만 = 14000+6000  (합 = 정확히 10만)
// 수수료(FREEZE): 카드 2.3%(2026-06-01부터) · 포인트 0%</span></pre>`},

{node:"payout", support:["lake"], conns:["spark_payout","nessie_minio"],
 t:"파트너 정산·지급", w:"집계(settlement_agg) → 지급 명세",
 h:"파트너별로 합산해 지급액을 확정하고 명세를 제공",
 d:"라인×수단 명세를 <b>일 × 파트너 × 브랜드 × 수단</b>으로 집계해 파트너 7의 <b>지급액(payout = gross − fee)</b>을 확정합니다. 지급 전 <b>대사</b>로 돈 보존을 확인 — 원천 결제총액 = 정산 gross(diff 0), 카드 MID별 = PG 파일(diff 0). 통과하면 파트너/재무에 정산 명세를 제공합니다.",
 x:`<div class="datalabel">settlement_agg (일×파트너×브랜드×수단) — 파트너 7</div><table>
<tr><th>date</th><th>partner</th><th>method</th><th>gross</th><th>fee</th><th>payout</th></tr>

<div class="datalabel">지급 대사 (돈 보존 · 실측)</div><pre>recon_result (결제총액 = 정산 gross):  diff = <span class="hl">0</span>   ✓
recon_card   (카드 MID별 = PG 파일):   diff = <span class="hl">0</span>   ✓

<div class="note">이 전 과정이 <b>순서무관 멱등</b>(_seq dedup) 위에 서 있어 — 컨슈머가 죽어도, 재처리해도, 병렬로 섞여도 파트너에게 나가는 최종 정산액은 항상 같습니다.</div>`}
];

/* ── 렌더링 ── */
const board=document.getElementById('board'), packet=document.getElementById('packet');
const view=document.getElementById('view'), prog=document.getElementById('prog');
const boardwrap=document.getElementById('boardwrap'), svg=document.getElementById('links');
const lakebox=document.getElementById('lakebox');
const nodeEls={}; const linkEls={};

// 커넥터 그리기
LINKS.forEach(l=>{
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',l.d);
  p.setAttribute('class','link'+(l.dash?' dash':''));
  p.setAttribute('marker-end', l.dash?'url(#arw)':'url(#arw)');
  svg.appendChild(p); linkEls[l.id]=p; p._dash=!!l.dash;
});
// 노드 그리기
let flowN=0;
NODES.forEach(n=>{
  const el=document.createElement('div');
  el.className='pnode'+(n.flow?'':' sup');
  el.dataset.id=n.id;
  el.style.left=n.x+'px'; el.style.top=n.y+'px';
  el.style.width=n.w+'px'; el.style.height=n.h+'px';
  el.style.borderTopColor='var('+n.c+')';
  if(!n.flow) el.style.color='var('+n.c+')';
  let step='';
  if(n.flow){ flowN++; const si=flowN; step=`<div class="stepno">${si}</div>`; n._step=si-1; }
  el.innerHTML=`${step}<div class="hd"><span class="ic">${n.ic}</span><span class="nm">${n.nm}</span></div><div class="tech">${n.tech}</div>`;
  if(n.flow){ const idx=S.findIndex(s=>s.node===n.id); el.onclick=()=>{ pause(); go(idx); }; }
  else { el.onclick=()=>{ pause(); showInfra(n.id); }; }
  board.appendChild(el); nodeEls[n.id]=el;
});

/* 지원 인프라 상세 (클릭 시 표시) — 세분화된 각 인프라의 역할 */
const INFRA={
 nessie:{t:"Nessie — Iceberg REST 카탈로그", r:"테이블의 '현재 상태'를 추적하고 원자적으로 커밋 — 데이터의 Git", d:{
  "무슨 역할":"어떤 데이터 파일들이 <b>지금 테이블의 진짜 내용</b>인지(스냅샷)를 가리키는 포인터를 관리. 커밋 단위로 원자 교체.",
  "왜 MinIO와 분리?":"MinIO는 '바이트'만 담당. <b>'지금 유효한 버전'을 정하는 주체가 카탈로그</b>. 이게 있어야 append·타임트래블이 가능(없으면 전체교체만).",
  "구성":"0.99.0 · Iceberg REST API · warehouse = s3://lake/warehouse",
  "주소":"localhost:19120"}},
 minio:{t:"MinIO — S3 오브젝트 스토리지", r:"Parquet·Iceberg 파일의 실제 바이트를 보관", d:{
  "무슨 역할":"데이터 파일(<b>.parquet</b>)과 메타데이터(<b>.json</b>)를 오브젝트로 저장. Nessie가 가리키는 <b>실체</b>.",
  "왜 Nessie와 분리?":"관심사 분리 — 카탈로그(무엇이 최신인가) vs 스토리지(실제 내용). 덕분에 <b>클라우드 AWS S3로 그대로 대체</b> 가능.",
  "경로":"s3://lake/warehouse/… (data/*.parquet · metadata/*.json)",
  "콘솔":"localhost:9001"}},
 dlt:{t:"DLT — Dead Letter Topic", r:"처리 실패 메시지 격리 (유실 방지)", d:{
  "동작":"파싱 실패(악성) = 재시도 없이 바로 DLT · 일시 오류 = 재시도 후 DLT",
  "효과":"poison 메시지가 <b>전체 흐름을 막지 못함</b>, 유실도 없음",
  "토픽":"&lt;topic&gt;.DLT"}},
 obs:{t:"Prometheus + Grafana — 관측", r:"파이프라인 상태를 실시간 모니터링", d:{
  "Prometheus":"kafka-exporter(:9308) + 컨슈머 actuator(:8090)를 5초마다 스크랩",
  "Grafana":"통합 대시보드 — LAG·소비율·랜딩 적재율·스레드별 파티션 배정",
  "주소":"Grafana localhost:3000"}}
};
function showInfra(id){
  const it=INFRA[id]; if(!it) return;
  document.querySelectorAll('.pnode').forEach(x=>x.classList.remove('active'));
  nodeEls[id].classList.add('active');
  let h=`<h2>🔧 ${it.t}</h2><div class="where">지원 인프라 · 흐름 단계와 별개</div>
    <div class="does">⚙ ${it.r}</div><dl style="font-size:12.5px;line-height:1.65">`;
  for(const[k,v] of Object.entries(it.d)) h+=`<dt style="color:#9db4de;font-weight:700;margin-top:10px;font-size:11.5px">${k}</dt><dd>${v}</dd>`;
  view.innerHTML=h+`</dl><div class="note">단계 흐름으로 돌아가려면 번호 노드를 클릭하거나 ◀ ▶ / 재생을 누르세요.</div>`;
}

let cur=-1, playing=false, timer=null, speed=1;

function positionPacket(){
  const el=nodeEls[S[cur].node];
  packet.style.left=(el.offsetLeft+el.offsetWidth/2)+'px';
  packet.style.top =(el.offsetTop +el.offsetHeight/2)+'px';
}
function go(i){
  if(i<0||i>=S.length) return;
  const hop=i!==cur; cur=i;
  const s=S[i];
  // 노드 상태
  NODES.forEach(n=>{
    const el=nodeEls[n.id];
    if(n.flow){
      el.classList.toggle('active', n.id===s.node);
      el.classList.toggle('passed', n._step<i);
    }else{
      const lake=(n.id==='nessie'||n.id==='minio') && s.support.includes('lake');
      el.classList.toggle('on', s.support.includes(n.id) || lake);
    }
  });
  // 레이크 저장소 박스
  lakebox.classList.toggle('on', s.support.includes('lake'));
  // 커넥터 하이라이트
  Object.entries(linkEls).forEach(([id,p])=>{
    const on=s.conns.includes(id);
    p.setAttribute('class','link'+(p._dash?' dash':'')+(on?' flow'+(p._dash?' dashflow':''):''));
    p.setAttribute('marker-end', on?'url(#arwf)':'url(#arw)');
  });
  // 패킷
  positionPacket();
  if(hop){ packet.classList.remove('hop'); void packet.offsetWidth; packet.classList.add('hop'); }
  // 활성 노드 화면 중앙으로
  const el=nodeEls[s.node];
  boardwrap.scrollTo({left: el.offsetLeft - boardwrap.clientWidth/2 + el.offsetWidth/2, behavior:'smooth'});
  // 상세
  view.innerHTML=`<h2>${i+1}. ${s.t}</h2><div class="where">${s.w}</div>
    <div class="does">⚙ ${s.h}</div>
    <div class="desc">${s.d}</div>${s.x}`;
  prog.textContent=`${i+1} / ${S.length}`;
}

/* ── 재생 제어 ── */
const playBtn=document.getElementById('playBtn');
function scheduleNext(){
  timer=setTimeout(()=>{
    if(cur<S.length-1){ go(cur+1); scheduleNext(); } else pause();
  }, 2800*speed);
}
function play(){
  if(cur>=S.length-1) go(0);
  playing=true; playBtn.textContent='⏸ 일시정지'; playBtn.classList.add('on'); scheduleNext();
}
function pause(){
  playing=false; playBtn.textContent='▶ 재생'; playBtn.classList.remove('on'); clearTimeout(timer);
}
playBtn.onclick=()=> playing?pause():play();
document.getElementById('resetBtn').onclick=()=>{ pause(); go(0); };
document.getElementById('prevBtn').onclick=()=>{ pause(); if(cur>0) go(cur-1); };
document.getElementById('nextBtn').onclick=()=>{ pause(); if(cur<S.length-1) go(cur+1); };
document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.sp').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); speed=parseFloat(b.dataset.sp);
  if(playing){ clearTimeout(timer); scheduleNext(); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){ pause(); if(cur<S.length-1) go(cur+1); }
  if(e.key==='ArrowLeft'){ pause(); if(cur>0) go(cur-1); }
  if(e.key===' '){ e.preventDefault(); playing?pause():play(); }
});
window.addEventListener('resize', ()=>{ if(cur>=0) positionPacket(); });

go(0);
</script>
</body>
</html>
