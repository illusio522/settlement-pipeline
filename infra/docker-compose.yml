name: settlement-pipeline

services:
  # ---------- 소스 DB (OLTP + Outbox), CDC 가능하게 logical WAL ----------
  postgres:
    image: postgres:16
    container_name: sp-postgres
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?infra/.env 필요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?infra/.env 필요}
      POSTGRES_DB: postgres   # 실제 DB는 init.sql에서 paydb(결제)·orderdb(주문) 생성
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?infra/.env 필요} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Kafka (KRaft 단일노드, ZooKeeper 없음) ----------
  kafka:
    image: apache/kafka:3.8.0
    container_name: sp-kafka
    ports:
      - "127.0.0.1:29092:29092"   # 호스트(자바 앱)에서 접속용
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: sp-kraft-cluster-0001
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # ★ 자동생성 토픽의 파티션 수. 기본값 1이면 4-A 병렬화(8스레드)·5 샤딩이 무력화됨.
      KAFKA_NUM_PARTITIONS: 4
      # ★ 미지정 시 Kafka 기본값 /tmp/kafka-logs(컨테이너 쓰기 레이어) → 재생성마다 토픽 전멸.
      #   볼륨 경로로 옮겨 CDC 토픽·_connect_configs·__consumer_offsets 를 영속화.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------- Debezium (Kafka Connect + CDC) ----------
  connect:
    image: debezium/connect:2.7.3.Final
    container_name: sp-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: sp-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------- MinIO (S3 호환 오브젝트스토리지 = 레이크) ----------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: sp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?infra/.env 필요}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?infra/.env 필요}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # 콘솔 UI
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Nessie (Iceberg REST 카탈로그 = 데이터의 Git) ----------
  #  진짜 Iceberg append/스냅샷/타임트래블을 관리하는 카탈로그. MinIO(S3)를 warehouse로.
  #  PyIceberg가 REST(:19120/iceberg)로 붙어 테이블 메타데이터를 원자 커밋.
  nessie:
    image: ghcr.io/projectnessie/nessie:0.99.0
    container_name: sp-nessie
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # 설정은 properties 파일로 (환경변수의 . / - 모호성 회피 — S3 중첩 시크릿 정확히 매핑)
      QUARKUS_CONFIG_LOCATIONS: /deployments/config/application.properties
      # properties 안에서 ${...} 표현식으로 참조 (자격증명은 파일에 두지 않음)
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?infra/.env 필요}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?infra/.env 필요}
    volumes:
      - ./nessie/application.properties:/deployments/config/application.properties:ro
    ports:
      - "127.0.0.1:19120:19120"   # Nessie API + Iceberg REST
    healthcheck:
      # Iceberg REST config가 200이면 카탈로그가 실제 서빙 중(health 엔드포인트보다 정확)
      test: ["CMD-SHELL", "curl -sf http://localhost:19120/iceberg/v1/config || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------- Kafka UI (토픽/메시지 가시화, 선택) ----------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: sp-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"   # 호스트 8080은 별도 nginx가 점유 → 8081로 회피
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"

  # ---------- 관측: kafka-exporter (Kafka 메트릭 → Prometheus) ----------
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: sp-kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:9308:9308"   # /metrics (컨슈머 LAG·오프셋·메시지율)

  # ---------- 관측: Prometheus (메트릭 수집·시계열 저장) ----------
  prometheus:
    image: prom/prometheus:v3.5.4
    container_name: sp-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - kafka-exporter

  # ---------- 관측: Grafana (실시간 그래프 대시보드) ----------
  grafana:
    image: grafana/grafana:13.0.2
    container_name: sp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?infra/.env 필요}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?infra/.env 필요}
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # 로그인 없이 바로 보기
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  pg-data:
  minio-data:
  kafka-data:
