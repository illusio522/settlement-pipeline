# Optional real-transport equivalence environment. Separate project and ports from existing infra.
services:
  postgres:
    environment:
      POSTGRES_USER: file_batch_test
      POSTGRES_PASSWORD: file_batch_test_local
    ports: !override
      - "127.0.0.1:55440:5432"
  kafka:
    image: apache/kafka:3.8.0
    ports: ["127.0.0.1:55441:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: file-batch-cdc-compare-01
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:55441
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 4
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
  apicurio:
    image: apicurio/apicurio-registry-kafkasql:2.4.1.Final
    ports: ["127.0.0.1:55442:8080"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl -sf http://localhost:8080/health/ready >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
  connect:
    image: debezium/connect:2.7.3.Final
    ports: ["127.0.0.1:55443:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: file-compare-connect
      ENABLE_APICURIO_CONVERTERS: "true"
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
      apicurio: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl -sf http://localhost:8083/ >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
