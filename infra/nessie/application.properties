# Nessie 설정 (properties 파일 = 환경변수의 . / - 모호성 회피).
# 마운트: /deployments/config/application.properties (Quarkus 자동 로드).

# 버전스토어: 학습용 in-memory (재시작 시 카탈로그 초기화, 데이터파일은 MinIO 잔존)
nessie.version.store.type=IN_MEMORY

# warehouse = MinIO 버킷 경로
nessie.catalog.default-warehouse=warehouse
nessie.catalog.warehouses.warehouse.location=s3://lake/warehouse

# S3(MinIO) 접속 — non-AWS라 endpoint·path-style 지정.
# 자격증명은 시크릿 URN 간접참조(공식 패턴): access-key → urn → 실제 name/secret
nessie.catalog.service.s3.default-options.region=us-east-1
nessie.catalog.service.s3.default-options.endpoint=http://sp-minio:9000
nessie.catalog.service.s3.default-options.path-style-access=true
nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:minio-creds
minio-creds.name=${MINIO_ROOT_USER}
minio-creds.secret=${MINIO_ROOT_PASSWORD}
